<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Selection Feature Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Feature Selection</h1>
    <div class="feature-card-container">
      <label for="storage" class="feature-card">
        <input id="storage" type="checkbox" />
        <h2 class="feature">Cloud Storage</h2>
        <p class="description">100 Gigabyte secure storage</p>
      </label>
      <label for="support" class="feature-card">
        <input id="support" type="checkbox" />
        <h2 class="feature">Dedicated Support</h2>
        <p class="description">24/7 customer help</p>
      </label>
      <label for="analytics" class="feature-card">
        <input id="analytics" type="checkbox" />
        <h2 class="feature">Advanced Analytics</h2>
        <p class="description">Insights & reports</p>
      </label>
      <label for="themes" class="feature-card">
        <input id="themes" type="checkbox" />
        <h2 class="feature">Custom User Themes</h2>
        <p class="description">Personalized dashboard design</p>
      </label>
      <label for="collaboration" class="feature-card">
        <input id="collaboration" type="checkbox" />
        <h2 class="feature">Multi-User Collab</h2>
        <p class="description">Team access and sharing</p>
      </label>
      <label for="api-access" class="feature-card">
        <input id="api-access" type="checkbox" />
        <h2 class="feature">API Access</h2>
        <p class="description">Integrate with your custom built tools</p>
      </label>
    </div>
  </body>
</html>
