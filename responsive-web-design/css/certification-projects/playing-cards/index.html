<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <p class="board">board</p>
    
    <main id="playing-cards">
      <div class="card">
        <div class="left">
          <div>A</div>
          <div>♠</div>
        </div>
        <div class="middle">
          <div>♠</div>
        </div>
        <div class="right">
          <div class="mirrored">♠</div>
          <div class="mirrored">A</div>
        </div>
      </div>
      <div class="card">
        <div class="left">
          <div>4</div>
          <div>♣</div>
        </div>
        <div class="middle">
          <div>♣ ♣</div>
          <div class="mirrored">♣ ♣</div>
        </div>
        <div class="right">
          <div class="mirrored">♣</div>
          <div class="mirrored">4</div>  
        </div>
      </div>
      <div class="card red">
        <div class="left">
          <div>5</div>
          <div>♦</div>
        </div>
        <div class="middle">
          <div>♦ ♦</div>
          <div>♦</div>
          <div>♦ ♦</div>
        </div>
        <div class="right">
          <div class="mirrored">♦</div>
          <div class="mirrored">5</div>
        </div>
      </div>
      <div class="card">
        <div class="left">
          <div>3</div>
          <div>♠</div>
        </div>
        <div class="middle">
          <div>♠</div>
          <div>♠</div>
          <div class="mirrored">♠</div>
        </div>
        <div class="right">
          <div class="mirrored">♠</div>
          <div class="mirrored">3</div>
        </div>
      </div>
      <div class="card red">
        <div class="left">
          <div>4</div>
          <div>♥</div>
        </div>
        <div class="middle">
          <div>♥ ♥</div>
          <div class="mirrored">♥ ♥</div>
        </div>
        <div class="right">
          <div class="mirrored">♥</div>
          <div class="mirrored">4</div>  
        </div>
      </div>
    </main>
    
    <p class="hand">your cards</p>
    
    <section id="hand">
      <div class="card red">
        <div class="left">
          <div>A</div>
          <div>♦</div>
        </div>
        <div class="middle">
          <div>♦</div>
        </div>
        <div class="right">
          <div class="mirrored">♦</div>
          <div class="mirrored">A</div>
        </div>
      </div>
      <div class="card red">
        <div class="left">
          <div>A</div>
          <div>♥</div>
        </div>
        <div class="middle">
          <div>♥</div>
        </div>
        <div class="right">
          <div class="mirrored">♥</div>
          <div class="mirrored">A</div>
        </div>
      </div>
    </section>
  </body>
  
</html>
