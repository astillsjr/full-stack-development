<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <h1>My To-Do List</h1>
      <ul class="todo-list">
        <li>
          <input type="checkbox" id="screen-repair">
          <label for="screen-repair">Repair phone screen</label>
          <ul class="sub-item">
            <li>
              <a href="https://www.cellphonerepair.com/locations" target="_blank" rel="noopener noreferrer" class="sub-item-link">Book the repair</a>
            </li>
          </ul>
        </li>
        <li>
          <input type="checkbox" id="update-resume">
          <label for="update-resume">Update resume</label>
          <ul class="sub-item">
            <li>
              <a href="https://docs.google.com/document/u/0/" target="_blank" rel="noopener noreferrer" class="sub-item-link">Edit resume</a>
            </li>
          </ul>
        </li>
        <li>
          <input type="checkbox" id="data-dump">
          <label for="data-dump">Finish data dump</label>
          <ul class="sub-item">
            <li>
              <a href="https://docs.google.com/spreadsheets/u/0/" target="_blank" rel="noopener noreferrer" class="sub-item-link">Open spreadsheet</a>
            </li>
          </ul>
        </li>
        <li>
          <input type="checkbox" id="chatbot">
          <label for="chatbot">Work on chatbot slides</label>
          <ul class="sub-item">
            <li>
              <a href="https://docs.google.com/presentation/u/0/" target="_blank" rel="noopener noreferrer" class="sub-item-link">Edit presentation</a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </body>
</html>
